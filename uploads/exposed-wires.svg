<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)" />

  <!-- Grid pattern overlay -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="500" x2="800" y2="500" />
    <line x1="100" y1="0" x2="100" y2="600" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="500" y1="0" x2="500" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
    <line x1="700" y1="0" x2="700" y2="600" />
  </g>

  <!-- CampusFix Evidence Card -->
  <rect x="60" y="60" width="680" height="480" rx="24" fill="#1e293b" stroke="#334155" stroke-width="2" filter="url(#shadow)" />

  <!-- Badge Header -->
  <rect x="100" y="100" width="180" height="36" rx="18" fill="#dc2626" fill-opacity="0.2" stroke="#dc2626" stroke-width="1.5" />
  <text x="190" y="124" fill="#dc2626" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">ELECTRICITY</text>

  <!-- Date / Watermark -->
  <text x="660" y="124" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="end">CAMPUS INCIDENT PHOTO EVIDENCE</text>

  <!-- Visual Icon Illustration -->
  <circle cx="400" cy="270" r="85" fill="#0f172a" stroke="#dc2626" stroke-width="3" />
  <text x="400" y="295" font-size="64" text-anchor="middle">⚡</text>

  <!-- Title -->
  <text x="400" y="410" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" text-anchor="middle">Exposed High-Voltage Wiring</text>

  <!-- Location info badge -->
  <rect x="250" y="445" width="300" height="38" rx="8" fill="#0f172a" />
  <text x="400" y="469" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" text-anchor="middle">📍 Verified Campus Location - Incident Logged</text>
</svg>